<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Editor — Toolbar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 40px; }
    h1 { max-width: 800px; margin: 0 auto 16px; font-size: 24px; color: #333; }

    .editor-container { max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }

    /* Toolbar */
    .toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid #eee; background: #fafafa; }
    .toolbar-group { display: flex; gap: 2px; }
    .toolbar-group + .toolbar-group { margin-left: 8px; padding-left: 8px; border-left: 1px solid #e0e0e0; }
    .toolbar button {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 8px; border: 1px solid transparent; border-radius: 4px; background: none;
      cursor: pointer; font-size: 14px; color: #555; transition: all 0.15s;
    }
    .toolbar button:hover { background: #e8e8e8; }
    .toolbar button.active { background: #e0e7ff; color: #3b5bdb; border-color: #a5b4fc; }
    .toolbar button:disabled { opacity: 0.3; cursor: not-allowed; }
    .toolbar button svg { width: 20px; height: 20px; }
    .toolbar select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px; background: #fff; }

    /* Editor */
    .flash-editor { padding: 16px 24px; min-height: 400px; outline: none; font-size: 16px; line-height: 1.7; color: #333; }
    .flash-editor p { margin-bottom: 8px; }
    .flash-editor h1 { font-size: 28px; margin: 20px 0 8px; }
    .flash-editor h2 { font-size: 22px; margin: 16px 0 8px; }
    .flash-editor h3 { font-size: 18px; margin: 12px 0 8px; }
    .flash-editor blockquote { border-left: 3px solid #c4c4c4; padding-left: 16px; color: #666; margin: 8px 0; }
    .flash-editor code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 14px; font-family: 'Fira Code', monospace; }
    .flash-editor pre { background: #282c34; color: #abb2bf; padding: 16px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
    .flash-editor pre code { background: none; color: inherit; padding: 0; }
    .flash-editor hr { border: none; border-top: 2px solid #eee; margin: 16px 0; }
    .flash-editor strong { font-weight: 700; }
    .flash-editor em { font-style: italic; }
    .flash-editor s { text-decoration: line-through; }
    .flash-editor u { text-decoration: underline; }
    .flash-editor a { color: #0066cc; text-decoration: underline; }
    .flash-editor mark { background: #fff3b0; padding: 1px 2px; }
    .flash-editor ul, .flash-editor ol { padding-left: 24px; margin: 8px 0; }
    .flash-editor li { margin-bottom: 4px; }
    .flash-editor img { max-width: 100%; border-radius: 4px; }

    /* Status bar */
    .status-bar { padding: 6px 12px; border-top: 1px solid #eee; background: #fafafa; font-size: 12px; color: #999; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <h1>⚡ Flash Editor — Rich Toolbar</h1>

  <div class="editor-container">
    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
      <div class="toolbar-group">
        <select id="block-type" title="Block type">
          <option value="paragraph">Paragraph</option>
          <option value="heading-1">Heading 1</option>
          <option value="heading-2">Heading 2</option>
          <option value="heading-3">Heading 3</option>
          <option value="code-block">Code Block</option>
        </select>
      </div>

      <div class="toolbar-group">
        <button id="btn-bold" title="Bold (Ctrl+B)"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M6 2.5C5.17157 2.5 4.5 3.17157 4.5 4V20C4.5 20.8284 5.17157 21.5 6 21.5H15C16.4587 21.5 17.8576 20.9205 18.8891 19.8891C19.9205 18.8576 20.5 17.4587 20.5 16C20.5 14.5413 19.9205 13.1424 18.8891 12.1109C18.6781 11.9 18.4518 11.7079 18.2128 11.5359C19.041 10.5492 19.5 9.29829 19.5 8C19.5 6.54131 18.9205 5.14236 17.8891 4.11091C16.8576 3.07946 15.4587 2.5 14 2.5H6ZM14 10.5C14.663 10.5 15.2989 10.2366 15.7678 9.76777C16.2366 9.29893 16.5 8.66304 16.5 8C16.5 7.33696 16.2366 6.70107 15.7678 6.23223C15.2989 5.76339 14.663 5.5 14 5.5H7.5V10.5H14ZM7.5 18.5V13.5H15C15.663 13.5 16.2989 13.7634 16.7678 14.2322C17.2366 14.7011 17.5 15.337 17.5 16C17.5 16.663 17.2366 17.2989 16.7678 17.7678C16.2989 18.2366 15.663 18.5 15 18.5H7.5Z"/></svg></button>
        <button id="btn-italic" title="Italic (Ctrl+I)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.0222 3H19C19.5523 3 20 3.44772 20 4C20 4.55228 19.5523 5 19 5H15.693L10.443 19H14C14.5523 19 15 19.4477 15 20C15 20.5523 14.5523 21 14 21H9.02418C9.00802 21.0004 8.99181 21.0004 8.97557 21H5C4.44772 21 4 20.5523 4 20C4 19.4477 4.44772 19 5 19H8.30704L13.557 5H10C9.44772 5 9 4.55228 9 4C9 3.44772 9.44772 3 10 3H14.9782C14.9928 2.99968 15.0075 2.99967 15.0222 3Z"/></svg></button>
        <button id="btn-underline" title="Underline (Ctrl+U)"><svg viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M7 4C7 3.44772 6.55228 3 6 3C5.44772 3 5 3.44772 5 4V10C5 11.8565 5.7375 13.637 7.05025 14.9497C8.36301 16.2625 10.1435 17 12 17C13.8565 17 15.637 16.2625 16.9497 14.9497C18.2625 13.637 19 11.8565 19 10V4C19 3.44772 18.5523 3 18 3C17.4477 3 17 3.44772 17 4V10C17 11.3261 16.4732 12.5979 15.5355 13.5355C14.5979 14.4732 13.3261 15 12 15C10.6739 15 9.40215 14.4732 8.46447 13.5355C7.52678 12.5979 7 11.3261 7 10V4ZM4 19C3.44772 19 3 19.4477 3 20C3 20.5523 3.44772 21 4 21H20C20.5523 21 21 20.5523 21 20C21 19.4477 20.5523 19 20 19H4Z"/></svg></button>
        <button id="btn-strike" title="Strikethrough (Ctrl+Shift+X)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9.00039 3H16.0001C16.5524 3 17.0001 3.44772 17.0001 4C17.0001 4.55229 16.5524 5 16.0001 5H9.00011C8.68006 4.99983 8.36412 5.07648 8.07983 5.22349C7.79555 5.37051 7.55069 5.5836 7.36585 5.84487C7.181 6.10614 7.06155 6.40796 7.01754 6.72497C6.97352 7.04198 7.00623 7.36492 7.11292 7.66667C7.29701 8.18737 7.02414 8.75872 6.50344 8.94281C5.98274 9.1269 5.4114 8.85403 5.2273 8.33333C5.01393 7.72984 4.94851 7.08396 5.03654 6.44994C5.12456 5.81592 5.36346 5.21229 5.73316 4.68974C6.10285 4.1672 6.59256 3.74101 7.16113 3.44698C7.72955 3.15303 8.36047 2.99975 9.00039 3Z"/><path d="M18 13H20C20.5523 13 21 12.5523 21 12C21 11.4477 20.5523 11 20 11H4C3.44772 11 3 11.4477 3 12C3 12.5523 3.44772 13 4 13H14C14.7956 13 15.5587 13.3161 16.1213 13.8787C16.6839 14.4413 17 15.2044 17 16C17 16.7956 16.6839 17.5587 16.1213 18.1213C15.5587 18.6839 14.7956 19 14 19H6C5.44772 19 5 19.4477 5 20C5 20.5523 5.44772 21 6 21H14C15.3261 21 16.5979 20.4732 17.5355 19.5355C18.4732 18.5979 19 17.3261 19 16C19 14.9119 18.6453 13.8604 18 13Z"/></svg></button>
        <button id="btn-code" title="Inline Code (Ctrl+E)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.4545 4.2983C15.6192 3.77115 15.3254 3.21028 14.7983 3.04554C14.2712 2.88081 13.7103 3.1746 13.5455 3.70175L8.54554 19.7017C8.38081 20.2289 8.6746 20.7898 9.20175 20.9545C9.72889 21.1192 10.2898 20.8254 10.4545 20.2983L15.4545 4.2983Z"/><path d="M6.70711 7.29289C7.09763 7.68342 7.09763 8.31658 6.70711 8.70711L3.41421 12L6.70711 15.2929C7.09763 15.6834 7.09763 16.3166 6.70711 16.7071C6.31658 17.0976 5.68342 17.0976 5.29289 16.7071L1.29289 12.7071C0.902369 12.3166 0.902369 11.6834 1.29289 11.2929L5.29289 7.29289C5.68342 6.90237 6.31658 6.90237 6.70711 7.29289Z"/><path d="M17.2929 7.29289C17.6834 6.90237 18.3166 6.90237 18.7071 7.29289L22.7071 11.2929C23.0976 11.6834 23.0976 12.3166 22.7071 12.7071L18.7071 16.7071C18.3166 17.0976 17.6834 17.0976 17.2929 16.7071C16.9024 16.3166 16.9024 15.6834 17.2929 15.2929L20.5858 12L17.2929 8.70711C16.9024 8.31658 16.9024 7.68342 17.2929 7.29289Z"/></svg></button>
        <button id="btn-highlight" title="Highlight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4z"/></svg></button>
      </div>

      <div class="toolbar-group">
        <button id="btn-link" title="Insert Link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></button>
        <button id="btn-image" title="Insert Image"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button>
      </div>

      <div class="toolbar-group">
        <button id="btn-bullet-list" title="Bullet List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg></button>
        <button id="btn-ordered-list" title="Ordered List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><text x="2" y="8" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif">1</text><text x="2" y="14" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif">2</text><text x="2" y="20" font-size="8" fill="currentColor" stroke="none" font-family="sans-serif">3</text></svg></button>
        <button id="btn-blockquote" title="Blockquote"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V21z"/><path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2h.75c0 2.25.25 4-2.75 4v3z"/></svg></button>
        <button id="btn-hr" title="Horizontal Rule">—</button>
      </div>

      <div class="toolbar-group">
        <button id="btn-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 105.64-11.36L1 10"/></svg></button>
        <button id="btn-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-5.64-11.36L23 10"/></svg></button>
      </div>
    </div>

    <!-- Editor element -->
    <div id="editor"></div>

    <!-- Status bar -->
    <div class="status-bar">
      <span id="word-count">0 words</span>
      <span id="char-count">0 characters</span>
    </div>
  </div>

  <script type="module">
    import { Editor } from '@flash/core';
    import { StarterKit } from '@flash/starter-kit';
    import { history, undo, redo } from '@flash/view';

    // ── Create Editor ──
    const editor = new Editor({
      element: document.getElementById('editor'),
      extensions: [
        ...StarterKit(),
      ],
      content: {
        type: 'doc',
        content: [
          { type: 'heading', attrs: { level: 1 }, content: [{ type: 'text', text: 'My Document' }] },
          { type: 'paragraph', content: [
            { type: 'text', text: 'Start writing your content here. Use the toolbar above or keyboard shortcuts to format text.' },
          ]},
        ],
      },
      onUpdate: () => updateUI(),
      onTransaction: () => updateUI(),
      onCreate: () => updateUI(),
    });

    // ── Toolbar handlers ──

    // Mark toggle buttons
    const markButtons = [
      { id: 'btn-bold',      command: 'toggleBold',      mark: 'bold' },
      { id: 'btn-italic',    command: 'toggleItalic',    mark: 'italic' },
      { id: 'btn-underline', command: 'toggleUnderline', mark: 'underline' },
      { id: 'btn-strike',    command: 'toggleStrike',    mark: 'strike' },
      { id: 'btn-code',      command: 'toggleCode',      mark: 'code' },
      { id: 'btn-highlight', command: 'toggleHighlight',  mark: 'highlight' },
    ];

    for (const { id, command } of markButtons) {
      document.getElementById(id).addEventListener('click', () => {
        editor.command(command);
        editor.focus?.();
      });
    }

    // Link
    document.getElementById('btn-link').addEventListener('click', () => {
      const href = prompt('Enter URL:', 'https://');
      if (href) {
        editor.command('toggleLink', { href });
      }
    });

    // Image
    document.getElementById('btn-image').addEventListener('click', () => {
      const src = prompt('Enter image URL:', 'https://');
      if (src) {
        const alt = prompt('Alt text:', '') || '';
        editor.command('insertImage', { src, alt });
      }
    });

    // Block type selector
    document.getElementById('block-type').addEventListener('change', (e) => {
      const value = e.target.value;
      switch (value) {
        case 'paragraph':
          editor.command('setParagraph');
          break;
        case 'heading-1':
          editor.command('setHeading', { level: 1 });
          break;
        case 'heading-2':
          editor.command('setHeading', { level: 2 });
          break;
        case 'heading-3':
          editor.command('setHeading', { level: 3 });
          break;
        case 'code-block':
          editor.command('setCodeBlock');
          break;
      }
    });

    // Lists & block formatting
    document.getElementById('btn-blockquote').addEventListener('click', () => editor.command('wrapInBlockquote'));
    document.getElementById('btn-bullet-list').addEventListener('click', () => editor.command('wrapInBulletList'));
    document.getElementById('btn-ordered-list').addEventListener('click', () => editor.command('wrapInOrderedList'));
    document.getElementById('btn-hr').addEventListener('click', () => editor.command('insertHorizontalRule'));

    // Undo / Redo
    document.getElementById('btn-undo').addEventListener('click', () => editor.command('undo'));
    document.getElementById('btn-redo').addEventListener('click', () => editor.command('redo'));

    // ── Update toolbar state ──
    function updateUI() {
      const state = editor.state;

      // Active marks
      for (const { id, mark } of markButtons) {
        const btn = document.getElementById(id);
        const isActive = editor.command('isMarkActive', mark);
        btn.classList.toggle('active', Boolean(isActive));
      }

      // Word & character count
      const text = state.doc.textContent || '';
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('word-count').textContent = `${words} word${words !== 1 ? 's' : ''}`;
      document.getElementById('char-count').textContent = `${text.length} character${text.length !== 1 ? 's' : ''}`;
    }
  </script>
</body>
</html>
