<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Editor — Multilingual (i18n)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 40px; }
    h1 { max-width: 800px; margin: 0 auto 16px; font-size: 24px; }

    .editor-container { max-width: 800px; margin: 0 auto; background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }

    /* Language switcher */
    .lang-bar { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #eee; background: #fafafa; }
    .lang-bar label { font-size: 13px; color: #666; font-weight: 500; }
    .lang-btn { padding: 6px 14px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; transition: all 0.15s; }
    .lang-btn:hover { background: #f0f0f0; }
    .lang-btn.active { background: #3b5bdb; color: #fff; border-color: #3b5bdb; }

    /* Toolbar */
    .toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 12px; border-bottom: 1px solid #eee; }
    .toolbar button { padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 12px; color: #555; }
    .toolbar button:hover { background: #e8e8e8; }

    /* Editor */
    .flash-editor { padding: 16px 24px; min-height: 300px; outline: none; font-size: 16px; line-height: 1.7; color: #333; }
    .flash-editor p { margin-bottom: 8px; }
    .flash-editor h1, .flash-editor h2, .flash-editor h3 { margin: 16px 0 8px; }
    .flash-editor strong { font-weight: 700; }
    .flash-editor em { font-style: italic; }
    .flash-editor u { text-decoration: underline; }
    .flash-editor s { text-decoration: line-through; }
    .flash-editor code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 14px; }
    .flash-editor blockquote { border-left: 3px solid #ddd; padding-left: 16px; color: #666; }

    /* Placeholder */
    .flash-editor[data-placeholder]:empty::before {
      content: attr(data-placeholder);
      color: #aaa;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>⚡ Flash Editor — Multilingual (i18n)</h1>

  <div class="editor-container">
    <!-- Language Switcher -->
    <div class="lang-bar">
      <label>🌐 Language:</label>
      <button class="lang-btn active" data-lang="en">English</button>
      <button class="lang-btn" data-lang="vi">Tiếng Việt</button>
      <button class="lang-btn" data-lang="zh">中文</button>
    </div>

    <!-- Dynamic Toolbar -->
    <div class="toolbar" id="toolbar"></div>

    <!-- Editor -->
    <div id="editor"></div>
  </div>

  <script type="module">
    import { Editor } from '@flash/core';
    import { StarterKit } from '@flash/starter-kit';
    import { createI18n, enMessages } from '@flash/i18n';
    import { viMessages } from '@flash/locale-vi';

    // ── Chinese locale (inline for demo) ──
    const zhMessages = {
      'bold': '粗体', 'italic': '斜体', 'underline': '下划线', 'strike': '删除线',
      'code': '代码', 'link': '链接', 'highlight': '高亮',
      'paragraph': '段落', 'heading': '标题', 'heading.level': '{level}级标题',
      'blockquote': '引用', 'code_block': '代码块',
      'bullet_list': '无序列表', 'ordered_list': '有序列表',
      'undo': '撤销', 'redo': '重做',
      'toolbar.text_style': '文本样式', 'toolbar.insert': '插入',
      'placeholder': '开始输入…',
      'link.url': '链接地址', 'link.apply': '应用', 'link.remove': '移除链接',
    };

    // ── Create i18n instance ──
    const i18n = createI18n({
      locale: 'en',
      fallbackLocale: 'en',
      messages: {
        en: enMessages,
        vi: viMessages,
        zh: zhMessages,
      },
    });

    // ── Create Editor with i18n ──
    const editor = new Editor({
      element: document.getElementById('editor'),
      extensions: StarterKit(),
      i18n: {
        locale: 'en',
        fallbackLocale: 'en',
        messages: { en: enMessages, vi: viMessages, zh: zhMessages },
      },
      content: {
        type: 'doc',
        content: [
          { type: 'heading', attrs: { level: 2 }, content: [{ type: 'text', text: 'Multilingual Editor' }] },
          { type: 'paragraph', content: [
            { type: 'text', text: 'Switch languages above to see the toolbar labels change in real-time.' },
          ]},
          { type: 'paragraph', content: [
            { type: 'text', text: 'Supports English, Tiếng Việt, and 中文 out of the box.' },
          ]},
        ],
      },
    });

    // ── Toolbar rendering (re-renders on locale change) ──
    function renderToolbar() {
      const toolbar = document.getElementById('toolbar');
      const items = [
        { key: 'bold', cmd: 'toggleBold', icon: '<b>B</b>' },
        { key: 'italic', cmd: 'toggleItalic', icon: '<i>I</i>' },
        { key: 'underline', cmd: 'toggleUnderline', icon: '<u>U</u>' },
        { key: 'strike', cmd: 'toggleStrike', icon: '<s>S</s>' },
        { key: 'code', cmd: 'toggleCode', icon: '&lt;/&gt;' },
        { key: 'highlight', cmd: 'toggleHighlight', icon: '🖍' },
        null, // separator
        { key: 'heading.level', cmd: 'setHeading', args: { level: 1 }, icon: 'H1', params: { level: 1 } },
        { key: 'heading.level', cmd: 'setHeading', args: { level: 2 }, icon: 'H2', params: { level: 2 } },
        { key: 'blockquote', cmd: 'wrapInBlockquote', icon: '❝' },
        null,
        { key: 'undo', cmd: 'undo', icon: '↩' },
        { key: 'redo', cmd: 'redo', icon: '↪' },
      ];

      toolbar.innerHTML = '';
      for (const item of items) {
        if (!item) {
          const sep = document.createElement('span');
          sep.style.cssText = 'width: 1px; height: 20px; background: #ddd; margin: 0 6px;';
          toolbar.appendChild(sep);
          continue;
        }
        const btn = document.createElement('button');
        const label = i18n.t(item.key, item.params);
        btn.innerHTML = item.icon;
        btn.title = label;
        btn.setAttribute('aria-label', label);
        btn.addEventListener('click', () => {
          if (item.args) editor.command(item.cmd, item.args);
          else editor.command(item.cmd);
        });
        toolbar.appendChild(btn);
      }
    }

    // ── Language switcher ──
    document.querySelectorAll('.lang-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const lang = btn.dataset.lang;

        // Update active state
        document.querySelectorAll('.lang-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');

        // Switch locale
        i18n.setLocale(lang);
        editor.setLocale(lang);

        // Re-render toolbar with new labels
        renderToolbar();

        // Update placeholder
        const editorEl = document.querySelector('.flash-editor');
        if (editorEl) {
          editorEl.setAttribute('data-placeholder', i18n.t('placeholder'));
        }

        // Update page direction for RTL locales (future-proof)
        document.documentElement.dir = (lang === 'ar' || lang === 'he') ? 'rtl' : 'ltr';
      });
    });

    // Initial render
    renderToolbar();
  </script>
</body>
</html>
