<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Editor — UI Components Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f1f3; padding: 32px 16px; color: #1a1a2e; }

    .page { max-width: 900px; margin: 0 auto; }
    .page > h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .page > p { color: #6c757d; font-size: 14px; margin-bottom: 20px; }

    .editor-container {
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .status-bar {
      display: flex; justify-content: space-between;
      padding: 6px 16px; border-top: 1px solid #eee;
      font-size: 12px; color: #999; background: #fafafa;
    }

    /* Theme & template selectors */
    .controls { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .controls label { font-size: 13px; font-weight: 500; color: #555; }
    .controls select {
      padding: 6px 10px; border: 1px solid #dadce0; border-radius: 6px;
      font-size: 13px; background: #fff; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Flash Editor — UI Components</h1>
    <p>Toolbar, BubbleMenu, FloatingMenu, SlashCommand, LinkEditor, Themes & Templates — all from <code>@flash/ui</code>.</p>

    <div class="controls">
      <label>Theme:</label>
      <select id="theme-select">
        <option value="default">Default</option>
        <option value="notion">Notion</option>
        <option value="docs">Google Docs</option>
      </select>
      <label>Template:</label>
      <select id="template-select">
        <option value="">— None —</option>
        <option value="blog-post">Blog Post</option>
        <option value="meeting-notes">Meeting Notes</option>
        <option value="email">Email Draft</option>
        <option value="resume">Resume / CV</option>
      </select>
    </div>

    <div class="editor-container" id="editor-container">
      <!-- Toolbar, BubbleMenu, FloatingMenu, SlashCommand injected by JS -->
      <div id="editor"></div>
      <div class="status-bar">
        <span id="word-count">0 words</span>
        <span id="char-count">0 characters</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { Editor } from '@flash/core';
    import { StarterKit } from '@flash/starter-kit';
    import { Toolbar, BubbleMenu, FloatingMenu, SlashCommand, LinkEditor } from '@flash/ui';
    import { injectDefaultTheme } from '@flash/theme-default';
    import { injectNotionTheme } from '@flash/theme-notion';
    import { injectDocsTheme } from '@flash/theme-docs';
    import { templates, getTemplate } from '@flash/templates';

    // ── Inject default theme ──
    injectDefaultTheme();

    const container = document.getElementById('editor-container');

    // ── Create editor ──
    const editor = new Editor({
      element: document.getElementById('editor'),
      extensions: StarterKit(),
      content: {
        type: 'doc',
        content: [
          { type: 'heading', attrs: { level: 1 }, content: [{ type: 'text', text: 'Flash Editor UI Demo' }] },
          { type: 'paragraph', content: [
            { type: 'text', text: 'This demo showcases all ' },
            { type: 'text', marks: [{ type: 'bold' }], text: '@flash/ui' },
            { type: 'text', text: ' components working together.' },
          ]},
          { type: 'paragraph', content: [
            { type: 'text', text: 'Try: select text for ' },
            { type: 'text', marks: [{ type: 'bold' }], text: 'bubble menu' },
            { type: 'text', text: ', click an empty line for ' },
            { type: 'text', marks: [{ type: 'italic' }], text: 'floating menu' },
            { type: 'text', text: ', type ' },
            { type: 'text', marks: [{ type: 'code' }], text: '/' },
            { type: 'text', text: ' for slash commands.' },
          ]},
          { type: 'paragraph' },
          { type: 'paragraph', content: [
            { type: 'text', text: 'Use the controls above to switch themes and load document templates.' },
          ]},
        ],
      },
      onUpdate: () => updateUI(),
      onTransaction: () => updateUI(),
      onCreate: () => updateUI(),
    });

    // ── UI Components ──
    const toolbar = new Toolbar({ editor, container });
    const bubbleMenu = new BubbleMenu({ editor, container });
    const floatingMenu = new FloatingMenu({ editor, container });
    const slashCommand = new SlashCommand({ editor, container });
    const linkEditor = new LinkEditor({ editor, container });

    function updateUI() {
      toolbar.update();
      bubbleMenu.update();
      floatingMenu.update();
      slashCommand.update();
      linkEditor.update();

      // Word & char count
      const text = editor.state.doc.textContent || '';
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      document.getElementById('word-count').textContent = `${words} word${words !== 1 ? 's' : ''}`;
      document.getElementById('char-count').textContent = `${text.length} character${text.length !== 1 ? 's' : ''}`;
    }

    // ── Theme switcher ──
    const themeMap = { default: injectDefaultTheme, notion: injectNotionTheme, docs: injectDocsTheme };
    const themeIds = ['flash-theme-default', 'flash-theme-notion', 'flash-theme-docs'];

    document.getElementById('theme-select').addEventListener('change', (e) => {
      // Remove all theme styles
      for (const id of themeIds) {
        document.getElementById(id)?.remove();
      }
      // Inject selected theme
      const fn = themeMap[e.target.value];
      // Reset injected flag by removing element first
      if (fn) fn();
    });

    // ── Template switcher ──
    document.getElementById('template-select').addEventListener('change', (e) => {
      const tpl = getTemplate(e.target.value);
      if (tpl) {
        // Rebuild editor with new content by dispatching a replace-all transaction
        const { schema } = editor.state;
        const newDoc = schema.nodeFromJSON(tpl.content);
        const tr = editor.state.tr;
        tr.replaceWith(0, tr.doc.content.size, newDoc.content);
        editor.dispatch(tr);
      }
    });
  </script>
</body>
</html>
