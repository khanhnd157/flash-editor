<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash Editor — Programmatic API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 40px; }
    h1 { max-width: 900px; margin: 0 auto 8px; font-size: 24px; }
    .subtitle { max-width: 900px; margin: 0 auto 24px; color: #666; font-size: 14px; }

    .layout { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 320px; gap: 20px; }

    .editor-container { background: #fff; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; }
    .flash-editor { padding: 16px 24px; min-height: 400px; outline: none; font-size: 16px; line-height: 1.7; color: #333; }
    .flash-editor p { margin-bottom: 8px; }
    .flash-editor h1, .flash-editor h2, .flash-editor h3 { margin: 16px 0 8px; }
    .flash-editor strong { font-weight: 700; }
    .flash-editor em { font-style: italic; }
    .flash-editor code { background: #f0f0f0; padding: 2px 6px; border-radius: 3px; font-size: 14px; }
    .flash-editor blockquote { border-left: 3px solid #ddd; padding-left: 16px; color: #666; }
    .flash-editor mark { background: #fff3b0; }
    .flash-editor ul, .flash-editor ol { padding-left: 24px; margin: 8px 0; }

    .panel { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .panel h3 { font-size: 14px; color: #333; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .panel .btn-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .panel button { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; text-align: left; transition: all 0.15s; }
    .panel button:hover { background: #f0f4ff; border-color: #a5b4fc; }
    .panel .info { font-size: 12px; color: #999; margin-top: 4px; }

    .log { background: #1e1e1e; color: #d4d4d4; font-family: 'Fira Code', monospace; font-size: 12px; padding: 12px; border-radius: 6px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; margin-top: 12px; }
    .log .success { color: #4ec9b0; }
    .log .fail { color: #f44747; }
  </style>
</head>
<body>
  <h1>⚡ Flash Editor — Programmatic API</h1>
  <p class="subtitle">Demonstrates running commands, inspecting state, and building on top of the editor API.</p>

  <div class="layout">
    <div class="editor-container">
      <div id="editor"></div>
    </div>

    <div>
      <div class="panel">
        <h3>🔧 Run Commands</h3>
        <div class="btn-group">
          <button onclick="run('toggleBold')">Toggle Bold</button>
          <button onclick="run('toggleItalic')">Toggle Italic</button>
          <button onclick="run('setHeading', { level: 2 })">Set Heading 2</button>
          <button onclick="run('setParagraph')">Set Paragraph</button>
          <button onclick="run('wrapInBlockquote')">Wrap in Blockquote</button>
          <button onclick="run('wrapInBulletList')">Wrap in Bullet List</button>
          <button onclick="run('lift')">Lift (unwrap)</button>
          <button onclick="run('selectAll')">Select All</button>
          <button onclick="run('insertHorizontalRule')">Insert HR</button>
        </div>

        <h3>🔍 Dry-run (can?)</h3>
        <div class="btn-group">
          <button onclick="check('toggleBold')">Can toggle bold?</button>
          <button onclick="check('lift')">Can lift?</button>
          <button onclick="check('joinBackward')">Can join backward?</button>
        </div>

        <h3>📊 Inspect State</h3>
        <div class="btn-group">
          <button onclick="inspectDoc()">Log doc JSON</button>
          <button onclick="inspectSelection()">Log selection</button>
          <button onclick="inspectMarks()">Active marks at cursor</button>
          <button onclick="inspectWordCount()">Word count</button>
        </div>

        <h3>⛓ Command Chain</h3>
        <div class="btn-group">
          <button onclick="chainDemo()">Select All → Toggle Bold</button>
        </div>

        <div class="log" id="log">Ready.\n</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { Editor } from '@flash/core';
    import { StarterKit } from '@flash/starter-kit';

    const editor = new Editor({
      element: document.getElementById('editor'),
      extensions: StarterKit(),
      content: {
        type: 'doc',
        content: [
          { type: 'heading', attrs: { level: 1 }, content: [{ type: 'text', text: 'API Playground' }] },
          { type: 'paragraph', content: [
            { type: 'text', text: 'Use the buttons on the right to run commands programmatically.' },
          ]},
          { type: 'paragraph', content: [
            { type: 'text', text: 'Select some text, then click a formatting button. Or try the "can?" checks to see which commands are available in the current context.' },
          ]},
          { type: 'paragraph', content: [
            { type: 'text', text: 'The log panel shows command results and state inspection output.' },
          ]},
        ],
      },
    });

    // Expose globally for button onclick handlers
    window.editor = editor;

    const logEl = document.getElementById('log');
    function log(msg, type = '') {
      const span = document.createElement('span');
      span.className = type;
      span.textContent = msg + '\n';
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    window.run = function (name, ...args) {
      const result = editor.command(name, ...args);
      log(`▸ ${name}(${args.map(a => JSON.stringify(a)).join(', ')}) → ${result}`, result ? 'success' : 'fail');
    };

    window.check = function (name, ...args) {
      const result = editor.can().command(name, ...args);
      log(`? can ${name}() → ${result}`, result ? 'success' : 'fail');
    };

    window.inspectDoc = function () {
      const json = JSON.stringify(editor.state.doc.toJSON(), null, 2);
      log('Doc JSON:\n' + json);
    };

    window.inspectSelection = function () {
      const sel = editor.state.selection;
      log(`Selection: from=${sel.from} to=${sel.to} empty=${sel.empty}`);
      if (!sel.empty) {
        const text = editor.state.doc.textBetween(sel.from, sel.to);
        log(`  Selected text: "${text}"`);
      }
    };

    window.inspectMarks = function () {
      const $pos = editor.state.selection.$from;
      const marks = $pos.marks();
      if (marks.length === 0) {
        log('No active marks at cursor.');
      } else {
        log('Active marks: ' + marks.map(m => m.type.name).join(', '));
      }
    };

    window.inspectWordCount = function () {
      const text = editor.state.doc.textContent;
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      log(`Words: ${words}, Characters: ${chars}`);
    };

    window.chainDemo = function () {
      log('▸ chain: selectAll → toggleBold → run()');
      const result = editor.chain()
        .command('selectAll')
        .command('toggleBold')
        .run();
      log(`  chain result: ${result}`, result ? 'success' : 'fail');
    };
  </script>
</body>
</html>
